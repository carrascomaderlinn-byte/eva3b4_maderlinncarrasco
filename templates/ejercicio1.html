<!DOCTYPE html>
<html>
<head><title>Ejercicio 1</title></head>
<body>
    <h1>Ejercicio 1 - Notas</h1>
    <form method="POST">
        Nota 1: <input type="number" step="0.1" name="nota1" required><br><br>
        Nota 2: <input type="number" step="0.1" name="nota2" required><br><br>
        Nota 3: <input type="number" step="0.1" name="nota3" required><br><br>
        Asistencia: <input type="number" step="0.1" name="asistencia" required><br><br>
        <button type="submit">Calcular</button>
    </form>

    {% if promedio is not none %}
        <h2>Promedio: {{ promedio }}</h2>
        <h2>Estado: {{ estado }}</h2>
    {% endif %}
    <br>
    <a href="/">Volver</a>
</body>
</html>
